{% extends 'base.html' %}
{% block content %}
<div class="hero" id="hero">
  <div class="container text-center" style="position:relative; z-index:2;">
    <h1 class="display-4 fw-bold gradient-text mb-2"><i class="bi bi-bank2"></i> Raza International Bank</h1>
    <p class="text-muted-2 mb-5">Secure. Simple. Smart banking.</p>
    <div class="row justify-content-center g-4">
      <div class="col-10 col-md-4">
        <a href="{% url 'user_login' %}" class="card-glass role-card" data-tilt data-tilt-max="15" data-tilt-glare data-tilt-max-glare="0.3">
          <i class="bi bi-person-circle gradient-text"></i>
          <h3 class="mt-3">User Login</h3>
          <p class="text-muted-2 mb-0">Access your account</p>
        </a>
      </div>
      <div class="col-10 col-md-4">
        <a href="{% url 'admin_login' %}" class="card-glass role-card" data-tilt data-tilt-max="15" data-tilt-glare data-tilt-max-glare="0.3">
          <i class="bi bi-shield-lock-fill gradient-text"></i>
          <h3 class="mt-3">Admin Login</h3>
          <p class="text-muted-2 mb-0">Manage the bank</p>
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.1/vanilla-tilt.min.js"></script>
<script>
  if (window.innerWidth > 768) {
    VANTA.NET({ el: "#hero", color: 0x7C3AED, backgroundColor: 0x0B1026,
                points: 12, maxDistance: 22, mouseControls: true, touchControls: true });
  }
</script>
{% endblock %}
