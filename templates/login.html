{% extends 'base.html' %}
{% block title %}{{ role|title }} Login{% endblock %}
{% block content %}
<div class="hero" id="hero">
  <div class="card-glass p-4 p-md-5" style="width:100%; max-width:420px; margin:16px; position:relative; z-index:2;">
    <div class="text-center mb-4">
      <i class="bi {% if role == 'admin' %}bi-shield-lock-fill{% else %}bi-person-circle{% endif %} gradient-text" style="font-size:3rem;"></i>
      <h2 class="fw-bold mt-2">{{ role|title }} Login</h2>
      <p class="text-muted-2">Enter your CNIC and password</p>
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <input type="text" name="cnic" class="form-control" placeholder="CNIC (13 digits, no dashes)" maxlength="13" pattern="\d{13}" required>
      </div>
      <div class="mb-4">
        <input type="password" name="password" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-gradient w-100">Login</button>
    </form>
    <div class="text-center mt-3"><a href="{% url 'home' %}" class="text-muted-2">&larr; Back</a></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vanta/0.5.24/vanta.net.min.js"></script>
<script>
  if (window.innerWidth > 768) {
    VANTA.NET({ el: "#hero", color: 0x7C3AED, backgroundColor: 0x0B1026,
                points: 10, maxDistance: 22, mouseControls: true, touchControls: true });
  }
</script>
{% endblock %}
